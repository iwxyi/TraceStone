name: trace_stone
description: 拾年·Shinen - a gentle journal for recording life and growing with less pressure.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  calendar_date_picker2: ^2.0.1
  characters: ^1.4.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  path_provider: ^2.1.5
  webdav_client: ^1.2.2
  flutter_image_compress: ^2.3.0
  file_selector_platform_interface: ^2.7.0
  file_picker: ^10.3.7
  image_picker: ^1.2.1
  tflite_flutter: ^0.11.0
  uuid: ^4.5.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  geolocator: ^13.0.2
  http: ^1.6.0
  intl: ^0.20.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  objectbox_generator: any

flutter:
  uses-material-design: true
  assets:
    - assets/dev/diary_seed_dataset.json
    - assets/dev/retrieval_evaluation_cases.json
